<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence Log</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  body{font-family:system-ui,sans-serif;max-width:600px;margin:auto;padding:16px;background:#f4f5f7}
  h1{font-size:1.3rem}
  .card{background:#fff;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  label{font-weight:600;display:block;margin-top:10px}
  input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;margin-top:4px;font-size:1rem}
  button{background:#0a66c2;color:#fff;border:0;padding:12px;border-radius:8px;font-size:1rem;width:100%;margin-top:12px;cursor:pointer}
  button.sec{background:#444}
  .rec{border-bottom:1px solid #eee;padding:10px 0}
  .rec small{color:#666}
  .rec img{max-width:80px;border-radius:6px;margin:4px 4px 0 0}
  #status{font-size:.9rem;color:#060;margin:8px 0;white-space:pre-line}
  .auto{background:#e8f5e9;border:1px dashed #4caf50;padding:6px;border-radius:6px;font-size:.85rem;color:#2e7d32;margin-top:4px}
  .btnrow button{width:auto;padding:6px 12px;font-size:.85rem;margin:4px 4px 0 0}
  .share{background:#25d366}
</style>
</head>
<body>
<h1>📋 Evidence Log</h1>

<div class="card">
  <div id="status">Ready. Upload order screenshot — Order ID &amp; Store auto-read.</div>

  <label>📸 Order screenshot</label>
  <input id="shot" type="file" accept="image/*">

  <div id="autoBox" style="display:none">
    <div class="auto" id="autoInfo"></div>
  </div>

  <label>Category</label>
  <select id="cat">
    <option>Reusable bag not given</option>
    <option>Frozen items not packed separately</option>
    <option>Wrong item given</option>
    <option>Asked to convince customer wrongly</option>
    <option>Manager misconduct</option>
    <option>Other</option>
  </select>

  <label>Order ID</label>
  <input id="oid" placeholder="auto-filled from screenshot">

  <label>Store name</label>
  <input id="store" placeholder="auto-filled from screenshot">

  <label>Short note (optional)</label>
  <textarea id="desc" rows="2"></textarea>

  <label>Extra evidence photo (optional)</label>
  <input id="extra" type="file" accept="image/*" capture="environment">

  <button onclick="save()">💾 Save Record</button>
</div>

<div class="card">
  <b>Records: <span id="count">0</span></b>
  <div id="list"></div>
  <button class="sec" onclick="exportReport()">📄 Export Report (readable, with photos)</button>
  <button class="sec" onclick="exportData()">📤 Export Raw Data (JSON)</button>
  <button class="sec" onclick="clearAll()" style="background:#a00">🗑 Clear All</button>
</div>

<script>
let DB = JSON.parse(localStorage.getItem('evidenceDB') || '[]');

/* ---- OCR: remove phone status-bar junk (time, battery, network) ---- */
function cleanLines(text){
  return text.split('\n').map(l=>l.trim()).filter(l=>{
    if(!l) return false;
    if(/^\d{1,2}:\d{2}/.test(l)) return false;                  // clock "8:30"
    if(/KB\/s|Vo ?LTE|LTE\b|%$|5G|4G/.test(l)) return false;     // network/battery
    if(!/[A-Za-z0-9]/.test(l)) return false;                     // pure symbols
    return true;
  });
}

function normalizeOid(t){
  t = t.toUpperCase().replace(/[^A-Z0-9]/g,'');
  t = t.replace(/^0(?=D)/,'O');      // 0D439... -> OD439...
  t = t.replace(/^(?:00|OO)/,'O');    // 00439 -> O? keep simple
  return t;
}

function extractOrderId(text, lines){
  // 1) keyword line: "Order ID: ...", "ORD-...", "#..."
  for(const l of lines){
    let m = l.match(/(?:order\s*(?:id|no|number)?|ord)\s*[:.#\-]?\s*([A-Z0-9][A-Z0-9\-]{5,})/i);
    if(m) return normalizeOid(m[1]);
  }
  // 2) OD + 9+ digits anywhere (Clipkart/Flipkart style)
  let m = text.toUpperCase().replace(/[^A-Z0-9\n ]/g,' ').match(/\bO[0D][0-9]{9,}\b/);
  if(m) return m[0].replace(/^0(?=D)/,'O');
  // 3) any long digit run 8+
  m = text.match(/\b\d{8,}\b/);
  if(m) return m[0];
  return '';
}

function cleanName(s){
  return s.replace(/["'©®™*|#@]/g,' ').replace(/\s+/g,' ').trim().slice(0,60);
}

function extractStore(lines){
  // 1) explicit keyword: "Store: XYZ"
  for(let i=0;i<lines.length;i++){
    let m = lines[i].match(/(?:store|outlet|branch|hub|warehouse|dark\s*store)\s*[:.\-]\s*(.+)/i);
    if(m && m[1].trim().length>2) return cleanName(m[1]);
    if(/^(?:store|outlet|branch|hub)$/i.test(lines[i]) && lines[i+1]) return cleanName(lines[i+1]);
  }
  // 2) fallback: first line with 3+ letters (likely store name header)
  for(const l of lines){
    if((l.match(/[A-Za-z]/g)||[]).length>=3 && l.length>=4 && l.length<=60) return cleanName(l);
  }
  return '';
}

document.getElementById('shot').addEventListener('change', async e=>{
  const f = e.target.files[0];
  if(!f) return;
  setStatus('⏳ Reading screenshot… (5–15 seconds)');
  try{
    const res = await Tesseract.recognize(f, 'eng');
    const raw = res.data.text;
    console.log('OCR RAW:', raw);
    const lines = cleanLines(raw);

    const oid = extractOrderId(raw, lines);
    const store = extractStore(lines);

    if(oid) document.getElementById('oid').value = oid;
    if(store) document.getElementById('store').value = store;

    document.getElementById('autoBox').style.display='block';
    document.getElementById('autoInfo').textContent =
      '✅ Auto-detected:' + (oid?'\nOrder ID: '+oid:'') + (store?'\nStore: '+store:'') +
      '\n⏰ '+new Date().toLocaleString() +
      ((oid&&store)?'':'\n⚠️ Something unclear — please correct the fields manually');
    setStatus('Done. Check fields, then press Save.');
  }catch(err){
    setStatus('❌ Could not read image: '+err.message+'\nPlease type Order ID / Store manually.');
  }
});

function setStatus(t){ document.getElementById('status').textContent = t; }

function save(){
  const oid = document.getElementById('oid').value.trim();
  const store = document.getElementById('store').value.trim();
  if(!oid && !store){ alert('Please type Order ID or Store name'); return; }
  const extraFile = document.getElementById('extra').files[0];
  const shotFile = document.getElementById('shot').files[0];

  const entry = {
    date: new Date().toLocaleString(),
    category: document.getElementById('cat').value,
    oid, store,
    desc: document.getElementById('desc').value.trim(),
    shot: null, extra: null
  };

  let pending = (shotFile?1:0)+(extraFile?1:0);
  if(!pending) return commit();
  if(shotFile) readFile(shotFile, d=>entry.shot=d, done);
  if(extraFile) readFile(extraFile, d=>entry.extra=d, done);

  function done(){ if(--pending===0) commit(); }
  function readFile(f, cb, fin){ const r=new FileReader(); r.onload=e=>{cb(e.target.result);fin();}; r.readAsDataURL(f); }
  function commit(){
    DB.push(entry);
    localStorage.setItem('evidenceDB', JSON.stringify(DB));
    ['oid','store','desc'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('shot').value='';
    document.getElementById('extra').value='';
    document.getElementById('autoBox').style.display='none';
    render();
    setStatus('✅ Saved: '+new Date().toLocaleTimeString());
  }
}

/* ---- readable report with photos ---- */
function exportReport(){
  if(!DB.length){ alert('No records to export'); return; }
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
  let h = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Evidence Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:16px;color:#111}
    .r{border:1px solid #ccc;border-radius:8px;padding:14px;margin:14px 0;page-break-inside:avoid}
    .r b{font-size:1.05rem}
    .meta{color:#444;font-size:.9rem;margin:6px 0}
    .r img{max-width:100%;border-radius:6px;margin-top:8px}
    h1{font-size:1.3rem} h2{font-size:1rem;margin-top:20px}
    @media print{ .noprint{display:none} }
  </style></head><body>
  <button class="noprint" onclick="window.print()" style="padding:10px 16px;font-size:1rem">🖨️ Print / Save as PDF</button>
  <h1>📋 Evidence Report — Delivery Partner</h1>
  <div class="meta">Generated: ${new Date().toLocaleString()} | Total records: ${DB.length}</div>`;

  DB.forEach((r,i)=>{
    h += `<div class="r">
      <b>#${i+1} — ${esc(r.category)}</b>
      <div class="meta">🆔 Order ID: <b>${esc(r.oid)||'-'}</b> &nbsp;|&nbsp; 🏪 Store: <b>${esc(r.store)||'-'}</b><br>
      🕐 ${esc(r.date)}</div>
      ${r.desc?`<div>📝 ${esc(r.desc)}</div>`:''}
      ${r.shot?`<div>📸 Order screenshot:<br><img src="${r.shot}"></div>`:''}
      ${r.extra?`<div>📷 Evidence photo:<br><img src="${r.extra}"></div>`:''}
    </div>`;
  });

  h += `</body></html>`;
  const w = window.open('','_blank');
  w.document.write(h);
  w.document.close();
}

function shareRecord(i){
  const r = DB[i];
  const text =
    '📋 *Evidence Report*\n' +
    'Issue: ' + r.category + '\n' +
    'Order ID: ' + (r.oid||'-') + '\n' +
    'Store: ' + (r.store||'-') + '\n' +
    'Date/Time: ' + r.date + '\n' +
    'Details: ' + (r.desc||'-') + '\n' +
    '_(photos attached separately — please check)_';
  const files = [];
  [r.shot, r.extra].forEach((dataUrl, idx)=>{
    if(!dataUrl) return;
    try{
      const blob = dataURLtoBlob(dataUrl);
      files.push(new File([blob], 'evidence-'+(idx===0?'screenshot':'photo')+'.jpg', {type:'image/jpeg'}));
    }catch(e){}
  });
  if(navigator.canShare && files.length && navigator.canShare({files})){
    navigator.share({text, files}).catch(()=>{});
  } else if(navigator.share){
    navigator.share({text}).catch(()=>{});
  } else {
    window.open('https://wa.me/?text='+encodeURIComponent(text), '_blank');
  }
}

function dataURLtoBlob(dataUrl){
  const parts = dataUrl.split(';base64,');
  const mime = parts[0].split(':')[1];
  const raw = atob(parts[1]);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

function render(){
  document.getElementById('count').textContent = DB.length;
  document.getElementById('list').innerHTML = DB.slice().reverse().map((r,i)=>{
    const idx = DB.length-1-i;
    return `<div class="rec">
      <b>${r.category}</b><br>
      <small>🆔 ${r.oid||'-'} | 🏪 ${r.store||'-'}<br>🕐 ${r.date}<br>${(r.desc||'').replace(/</g,'&lt;')}</small><br>
      ${r.shot?`<img src="${r.shot}">`:''}${r.extra?`<img src="${r.extra}">`:''}
      <div class="btnrow">
        <button class="share" onclick="shareRecord(${idx})">📤 Share</button>
        <button class="sec" onclick="del(${idx})">❌ Delete</button>
      </div>
    </div>`;
  }).join('') || '<small>No records yet</small>';
}

function del(i){ if(confirm('Delete this record?')){ DB.splice(i,1); localStorage.setItem('evidenceDB',JSON.stringify(DB)); render(); } }
function clearAll(){ if(confirm('Delete ALL records permanently?')){ DB=[]; localStorage.removeItem('evidenceDB'); render(); } }
function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'evidence-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
render();
</script>
</body>
</html>
